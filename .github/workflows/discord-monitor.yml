name: Discord Repository Monitor

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  create:
  delete:
  # pull_request_target (not pull_request) so pull requests from forks can read
  # the DISCORD_WEBHOOK secret. This is safe because this workflow never checks
  # out or executes pull request code; it only reads the event payload.
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  release:
    # "published" already covers "released" and "prereleased"; listing all
    # three would send duplicate notifications for every release.
    types: [published, edited, deleted]
  fork:
  watch:
    types: [started]
  discussion:
    types: [created, edited, answered, closed, reopened, deleted, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_run:
    # GitHub rejects workflow_run triggers that do not list any workflows.
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
  member:
    types: [added, edited, deleted]
  public:
  milestone:
    types: [created, opened, edited, closed, deleted]
  label:
    types: [created, edited, deleted]
  deployment:
  deployment_status:
  status:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  repository_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Send Discord Notification
    # Never react to this workflow's own runs (prevents notification loops).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != github.workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pushes need the full history so the script can diff before..after.
      - name: Check out repository (full history)
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every other event only needs the script itself, from the default branch.
      - name: Check out repository (script only)
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Send notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 .github/scripts/discord_notify.py
