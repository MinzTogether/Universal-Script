name: Discord Repository Monitor

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            CHANGES=$(git diff-tree --root --no-commit-id --name-status -r "$AFTER")
          else
            CHANGES=$(git diff --name-status "$BEFORE" "$AFTER")
          fi

          echo "$CHANGES" > changes.txt

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BODY=""

          while IFS=$'\t' read -r status path oldpath; do
            [ -z "$status" ] && continue

            case "$status" in
              A) LINE="🆕 Thêm: $path" ;;
              M) LINE="✏️ Cập nhật: $path" ;;
              D) LINE="🗑️ Xóa: $path" ;;
              R*) LINE="🔀 Đổi tên: $oldpath → $path" ;;
              *) LINE="📄 $status: $path" ;;
            esac

            BODY="${BODY}\n${LINE}"
          done < changes.txt

          [ -z "$BODY" ] && BODY="\nKhông phát hiện thay đổi file."

          CONTENT="🚀 GitHub Repository Update
          📁 Repository: $REPO
          👤 Người thực hiện: $ACTOR
          🌿 Branch: $BRANCH
          📝 Commit: $MESSAGE
          📂 File changes:
          $BODY
          🔗 $SERVER_URL/$REPO/commit/$COMMIT"

          jq -n --arg content "$CONTENT" \
            '{content: $content}' |
            curl -fsS -H "Content-Type: application/json" \
            -d @- "$DISCORD_WEBHOOK"
            
